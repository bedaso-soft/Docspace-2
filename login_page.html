<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocSpace - Authentication</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <!-- Login Form -->
                <form id="loginForm" class="bg-white p-4 rounded shadow-sm">
                    <div class="text-center mb-4">
                        <h3 class="text-primary">📁 DocSpace</h3>
                        <p class="text-muted small">Sign in to continue</p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="loginEmail" class="form-control form-control-sm"
                            placeholder="email@example.com" required>
                        <div id="loginEmailError" class="text-danger small mt-1 d-none">Enter valid email</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="loginPassword" class="form-control form-control-sm"
                            placeholder="Enter password" required>
                        <div id="loginPasswordError" class="text-danger small mt-1 d-none">Password required</div>
                    </div>

                    <button class="btn btn-primary btn-sm w-100 mb-3">Sign in</button>

                    <div class="text-center text-muted small mb-2">or continue with</div>

                    <button type="button" class="btn btn-outline-dark btn-sm w-100 mb-3" onclick="googleAuth()">
                        <img src="https://www.google.com/favicon.ico" alt="Google" width="16" height="16" class="me-2">
                        Google
                    </button>

                    <div class="text-center small">
                        No account?
                        <a href="#" class="text-decoration-none" onclick="showRegister()">Register</a>
                    </div>
                </form>

                <!-- Register Form -->
                <form id="registerForm" class="bg-white p-4 rounded shadow-sm d-none">
                    <div class="text-center mb-4">
                        <h3 class="text-primary">📁 DocSpace</h3>
                        <p class="text-muted small">Create new account</p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" id="username" class="form-control form-control-sm" placeholder="Your name"
                            required>
                        <div id="usernameError" class="text-danger small mt-1 d-none">Minimum 2 characters</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="registerEmail" class="form-control form-control-sm"
                            placeholder="email@example.com" required>
                        <div id="registerEmailError" class="text-danger small mt-1 d-none">Enter valid email</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="registerPassword" class="form-control form-control-sm"
                            placeholder="Create password" required>
                        <div id="passwordError" class="text-danger small mt-1 d-none">Minimum 6 characters</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" id="confirmPassword" class="form-control form-control-sm"
                            placeholder="Repeat password" required>
                        <div id="confirmPasswordError" class="text-danger small mt-1 d-none">Passwords don't match</div>
                        <div id="passwordMatch" class="text-success small mt-1 d-none">✓ Passwords match</div>
                    </div>

                    <button class="btn btn-primary btn-sm w-100 mb-3">Create Account</button>

                    <div class="text-center text-muted small mb-2">or sign up with</div>

                    <button type="button" class="btn btn-outline-dark btn-sm w-100 mb-3" onclick="googleAuth()">
                        <img src="https://www.google.com/favicon.ico" alt="" width="16" height="16" class="me-2">
                        Google
                    </button>

                    <div class="text-center small">
                        Have account?
                        <a href="#" class="text-decoration-none" onclick="showLogin()">Sign in</a>
                    </div>
                </form>

                <!-- Message Display -->
                <div id="message" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");
        const message = document.getElementById("message");

        function showRegister() {
            loginForm.classList.add("d-none");
            registerForm.classList.remove("d-none");
            clearErrors();
            message.innerHTML = "";
        }

        function showLogin() {
            registerForm.classList.add("d-none");
            loginForm.classList.remove("d-none");
            clearErrors();
            message.innerHTML = "";
        }

        function clearErrors() {
            document.querySelectorAll('.text-danger, .text-success').forEach(el => {
                el.classList.add('d-none');
            });
        }

        function validateEmail(email) {
            return email.includes('@') && email.includes('.');
        }

        function checkPasswords() {
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const error = document.getElementById('confirmPasswordError');
            const match = document.getElementById('passwordMatch');

            if (confirm === '') {
                error.classList.add('d-none');
                match.classList.add('d-none');
                return false;
            }

            if (password === confirm) {
                error.classList.add('d-none');
                match.classList.remove('d-none');
                return true;
            } else {
                error.classList.remove('d-none');
                match.classList.add('d-none');
                return false;
            }
        }

        // Password confirmation check
        document.getElementById('confirmPassword')?.addEventListener('input', checkPasswords);
        document.getElementById('registerPassword')?.addEventListener('input', checkPasswords);

        // Form submissions
        loginForm.addEventListener("submit", login);
        registerForm.addEventListener("submit", register);

        async function login(e) {
            e.preventDefault();
            clearErrors();

            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;
            let valid = true;

            if (!validateEmail(email)) {
                document.getElementById("loginEmailError").classList.remove("d-none");
                valid = false;
            }

            if (password.length === 0) {
                document.getElementById("loginPasswordError").classList.remove("d-none");
                valid = false;
            }

            if (!valid) return;

            const data = new FormData();
            data.append("email", email);
            data.append("password", password);

            try {
                const res = await fetch("../backend/login.php", {
                    method: "POST",
                    body: data
                });

                const result = await res.json();

                if (result.success) {
                    localStorage.setItem("user_id", result.user_id);
                    showMsg("success", "Login successful!");
                    setTimeout(() => {
                        window.location.href = "main_page.php";
                    }, 1000);
                } else {
                    showMsg("danger", result.message || "Login failed");
                }
            } catch (err) {
                showMsg("danger", "Network error");
            }
        }

        async function register(e) {
            e.preventDefault();
            clearErrors();

            const username = document.getElementById("username").value;
            const email = document.getElementById("registerEmail").value;
            const password = document.getElementById("registerPassword").value;
            let valid = true;

            if (username.length < 2) {
                document.getElementById("usernameError").classList.remove("d-none");
                valid = false;
            }

            if (!validateEmail(email)) {
                document.getElementById("registerEmailError").classList.remove("d-none");
                valid = false;
            }

            if (password.length < 6) {
                document.getElementById("passwordError").classList.remove("d-none");
                valid = false;
            }

            if (!checkPasswords()) {
                valid = false;
            }

            if (!valid) return;

            const data = new FormData();
            data.append("username", username);
            data.append("email", email);
            data.append("password", password);

            try {
                const res = await fetch("../backend/register.php", {
                    method: "POST",
                    body: data
                });

                const result = await res.json();

                if (result.success) {
                    showMsg("success", "Account created!");
                    setTimeout(() => {
                        showLogin();
                    }, 1500);
                } else {
                    showMsg("danger", result.message || "Registration failed");
                }
            } catch (err) {
                showMsg("danger", "Network error");
            }
        }

        function googleAuth() {
            window.location.href = "http://localhost/DocSpace/backend/callback.php";
        }

        function showMsg(type, text) {
            message.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show py-2">
                <span class="small">${text}</span>
                <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>
            </div>`;
        }
    </script>
</body>

</html>
